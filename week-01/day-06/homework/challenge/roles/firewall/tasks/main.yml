---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allow required tools
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "22"
    - "80"
    - "443"

- name: Deny incoming connections by default
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Enable firewall
  community.general.ufw:
    state: enabled
