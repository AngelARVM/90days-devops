---
- name: Install Ngnix
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Start Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Deploy landing page
  ansible.builtin.copy:
    src: index.html
    dest: /var/www/html/index.html
    owner: www-data
    group: www-data
    mode: "6404"
