---
- name: Restart Worker
  ansible.builtin.systemd:
    name: voting-worker
    state: restarted
    daemon_reload: true

- name: Restart Vote
  ansible.builtin.systemd:
    name: voting-vote
    state: restarted
    daemon_reload: true

- name: Restart Result
  ansible.builtin.systemd:
    name: voting-result
    state: restarted
    daemon_reload: true
